databases:
  - name: hulklives-data
    databaseName: hulklives
    user: hulklives
    plan: free

services:
  - type: web
    name: hulklives-zombie
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: hulklives-data
          property: connectionString
